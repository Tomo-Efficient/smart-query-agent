<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问数 · 经营分析</title>
<meta name="description" content="自然语言问数：语义检索、SQL 校验、只读执行。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' fill='white' text-anchor='middle'%3E问%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">问</span>
    <span class="brand-text">问数</span>
  </a>
  <div class="topbar-right">
    <span class="pill" id="as-of">数据截止 <b>—</b></span>
    <span class="pill" id="mode"><b>连接中</b></span>
    <button class="ghost-btn" id="toggle-inspector" title="显示 / 隐藏轨迹">轨迹</button>
    <button class="ghost-btn" id="new-chat" hidden>新对话</button>
    <button class="ghost-btn" id="open-audit" hidden>审计</button>
    <button class="ghost-btn" id="open-drawer">语义资产 <span id="card-count">—</span></button>
    <div class="user-chip" id="user-chip" hidden>
      <span class="user-name" id="user-name">—</span>
      <span class="user-scope" id="user-scope">—</span>
      <button class="link-btn" id="logout">退出</button>
    </div>
  </div>
</header>

<main class="layout" id="app" hidden>
  <section class="chat">
    <div class="thread" id="thread">
      <div class="thread-inner">
        <div class="intro" id="intro">
          <h1>用一句话，问清楚经营数据</h1>
          <div class="suggest" id="suggest"></div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="问一句，例如：上月各渠道保费收入是多少" maxlength="500" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit">发送</button>
      </form>
      <div class="hint-row">
        <span><kbd>Enter</kbd> 发送 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span id="footer-note">只读查询</span>
      </div>
    </div>
  </section>

  <aside class="inspector" id="inspector">
    <div class="inspector-head"><span>轨迹</span><span class="time" id="total-time">—</span></div>
    <ol class="steps" id="steps"></ol>
    <div id="trace-empty" class="placeholder">—</div>

    <div class="section-label">检索</div>
    <div class="evidence" id="evidence"></div>
    <div id="evidence-empty" class="placeholder">—</div>

    <div class="section-label">SQL</div>
    <pre class="sql" id="sql">-- 等待提问</pre>

    <div class="section-label">校验</div>
    <div class="checks" id="checks"></div>
  </aside>
</main>

<div class="login-layer" id="login" hidden>
  <div class="login-card">
    <h1>问数工作台</h1>
    <form id="login-form" autocomplete="on">
      <label>工号<input id="login-user" name="username" autocomplete="username" required></label>
      <label>密码<input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>
      <div class="login-error" id="login-error" hidden></div>
      <button class="send" type="submit" id="login-btn">登录</button>
    </form>
    <div class="login-demo">
      <span class="label">演示</span>
      <button type="button" class="demo-row" data-user="admin" data-pass="admin123">admin</button>
      <button type="button" class="demo-row" data-user="zhang" data-pass="demo123">zhang</button>
      <button type="button" class="demo-row" data-user="li" data-pass="demo123">li</button>
    </div>
  </div>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="语义资产">
  <div class="drawer-head">
    <h2>语义资产</h2>
    <button class="ghost-btn" id="close-drawer">关闭</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<aside class="drawer" id="audit-drawer" aria-label="审计日志">
  <div class="drawer-head">
    <h2>审计日志</h2>
    <button class="ghost-btn" id="close-audit">关闭</button>
  </div>
  <div class="drawer-body" id="audit-body"></div>
</aside>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
