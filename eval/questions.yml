- id: T041
  family: surrender_rate
  category: ratio
  question: 上月各渠道退保率
  match: keyed
  tolerance: 0.03
  gold: "WITH s AS (\n  SELECT dp.channel_code, COUNT(DISTINCT s.policy_id) AS sur_cnt\n  FROM dwd_surrender s JOIN dwd_policy\
    \ dp ON s.policy_id = dp.policy_id\n  WHERE s.surrender_date >= DATE '2026-05-01' AND s.surrender_date < DATE '2026-06-01'\n\
    \  GROUP BY 1\n), a AS (\n  SELECT channel_code, COUNT(*) AS active_cnt FROM dwd_policy WHERE policy_status = '有效' GROUP\
    \ BY 1\n)\nSELECT c.channel_name AS 渠道, s.sur_cnt AS 退保件数,\n       ROUND(100.0 * s.sur_cnt / NULLIF(a.active_cnt, 0),\
    \ 2) AS 退保率百分比\nFROM a JOIN s USING (channel_code) JOIN dim_channel c USING (channel_code)\nORDER BY 3 DESC"
