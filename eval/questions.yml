- id: P10
  category: pitfall
  match: keyed
  tolerance: 0.01
  question: 上月各渠道保费和退保率
  gold: "WITH s AS (\n  SELECT dp.channel_code, COUNT(DISTINCT s.policy_id) AS sur_cnt\n  FROM dwd_surrender s JOIN dwd_policy\
    \ dp ON s.policy_id = dp.policy_id\n  WHERE s.surrender_date >= DATE '2026-05-01' AND s.surrender_date < DATE '2026-06-01'\
    \ GROUP BY 1\n), a AS (SELECT channel_code, COUNT(*) AS active_cnt FROM dwd_policy WHERE policy_status = '有效' GROUP BY\
    \ 1),\npm AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n  FROM dwd_premium_month p JOIN dwd_policy\
    \ dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month\
    \ < DATE '2026-06-01'\n  GROUP BY 1\n)\nSELECT c.channel_name AS 渠道, ROUND(pm.premium, 0) AS 保费,\n       ROUND(100.0 *\
    \ s.sur_cnt / NULLIF(a.active_cnt, 0), 2) AS 退保率百分比\nFROM pm JOIN a USING (channel_code) LEFT JOIN s USING (channel_code)\n\
    JOIN dim_channel c USING (channel_code) ORDER BY 3 DESC"
- id: E01
  category: edge
  match: keyed
  tolerance: 0.02
  question: 上月和上上月各渠道保费对比
  gold: "WITH cur AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n  FROM dwd_premium_month p JOIN dwd_policy\
    \ dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month\
    \ < DATE '2026-06-01'\n  GROUP BY 1\n), prev AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n \
    \ FROM dwd_premium_month p JOIN dwd_policy dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month\
    \ >= DATE '2026-04-01' AND p.stat_month < DATE '2026-05-01'\n  GROUP BY 1\n)\nSELECT c.channel_name AS 渠道, ROUND(cur.premium,\
    \ 0) AS 本月保费,\n       ROUND((cur.premium / NULLIF(prev.premium, 0) - 1) * 100, 2) AS 环比百分比\nFROM cur JOIN prev USING (channel_code)\
    \ JOIN dim_channel c USING (channel_code)\nORDER BY 2 DESC"
- id: E02
  category: edge
