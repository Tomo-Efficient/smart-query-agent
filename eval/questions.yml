- id: T091
  family: product_surrender
  category: ratio
  question: 上月各险种退保率
  match: keyed
  tolerance: 0.03
  gold: "WITH s AS (\n  SELECT dp.product_code, COUNT(DISTINCT s.policy_id) AS sur_cnt\n  FROM dwd_surrender s JOIN dwd_policy\
    \ dp ON s.policy_id = dp.policy_id\n  WHERE s.surrender_date >= DATE '2026-05-01' AND s.surrender_date < DATE '2026-06-01'\n\
    \  GROUP BY 1\n), a AS (\n  SELECT product_code, COUNT(*) AS active_cnt FROM dwd_policy WHERE policy_status = '有效' GROUP\
    \ BY 1\n)\nSELECT TRIM(pr.product_name) AS 险种, ROUND(100.0 * s.sur_cnt / NULLIF(a.active_cnt, 0), 2) AS 退保率百分比\nFROM a\
    \ JOIN s USING (product_code) JOIN dim_product pr USING (product_code)\nORDER BY 2 DESC"
