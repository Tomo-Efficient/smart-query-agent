- id: T021
  family: channel_avg
  category: metric
  question: 上月各渠道件均保费
  match: keyed
  tolerance: 0.01
  gold: "SELECT c.channel_name AS 渠道,\n       ROUND(SUM(COALESCE(p.premium, 0)) / NULLIF(COUNT(DISTINCT p.policy_id), 0),\
