- id: P05
  category: pitfall
  match: value
  tolerance: 0.01
  question: 退保率最高的渠道是哪个
  gold: "WITH s AS (\n  SELECT dp.channel_code, COUNT(DISTINCT s.policy_id) AS sur_cnt\n  FROM dwd_surrender s JOIN dwd_policy\
    \ dp ON s.policy_id = dp.policy_id\n  WHERE s.surrender_date >= DATE '2026-05-01' AND s.surrender_date < DATE '2026-06-01'\
    \ GROUP BY 1\n), a AS (SELECT channel_code, COUNT(*) AS active_cnt FROM dwd_policy WHERE policy_status = '有效' GROUP BY\
    \ 1)\nSELECT c.channel_name AS 渠道, ROUND(100.0 * s.sur_cnt / NULLIF(a.active_cnt, 0), 2) AS 退保率百分比\nFROM a JOIN s USING\
    \ (channel_code) JOIN dim_channel c USING (channel_code)\nORDER BY 2 DESC LIMIT 1"
- id: P06
  category: pitfall
  match: keyed
  tolerance: 0.01
  question: 件均保费最低的渠道
  gold: "SELECT c.channel_name AS 渠道,\n       ROUND(SUM(COALESCE(p.premium, 0)) / NULLIF(COUNT(DISTINCT p.policy_id), 0),\
    \ 0) AS 件均保费\nFROM dwd_premium_month p JOIN dwd_policy dp ON p.policy_id = dp.policy_id\nJOIN dim_channel c ON p.channel_code\
    \ = c.channel_code\nWHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month < DATE '2026-06-01'\n\
    GROUP BY 1 ORDER BY 2 ASC LIMIT 1"
- id: P07
  category: pitfall
  match: keyed
  tolerance: 0.02
  question: 各渠道保单件数和件均保费
  gold: "SELECT c.channel_name AS 渠道, COUNT(DISTINCT p.policy_id) AS 保单件数,\n       ROUND(SUM(COALESCE(p.premium, 0)) / NULLIF(COUNT(DISTINCT\
    \ p.policy_id), 0), 0) AS 件均保费\nFROM dwd_premium_month p JOIN dwd_policy dp ON p.policy_id = dp.policy_id\nJOIN dim_channel\
    \ c ON p.channel_code = c.channel_code\nWHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month\
    \ < DATE '2026-06-01'\nGROUP BY 1 ORDER BY 2 DESC"
