- id: T111
  family: claim_ratio
  category: ratio
  question: 上月各险种赔付率
  match: keyed
  tolerance: 0.05
  gold: "WITH cl AS (\n  SELECT dp.product_code, SUM(c.claim_amount) AS claim_amt\n  FROM dwd_claim c JOIN dwd_policy dp ON\
    \ c.policy_id = dp.policy_id\n  WHERE c.claim_date >= DATE '2026-05-01' AND c.claim_date < DATE '2026-06-01'\n  GROUP\
    \ BY 1\n), pm AS (\n  SELECT p.product_code, SUM(COALESCE(p.premium, 0)) AS premium\n  FROM dwd_premium_month p JOIN dwd_policy\
    \ dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month\
    \ < DATE '2026-06-01'\n  GROUP BY 1\n)\nSELECT TRIM(pr.product_name) AS 险种, ROUND(100.0 * cl.claim_amt / NULLIF(pm.premium,\
    \ 0), 2) AS 赔付率百分比\nFROM cl JOIN pm USING (product_code) JOIN dim_product pr ON cl.product_code = pr.product_code\nORDER\
    \ BY 2 DESC"
