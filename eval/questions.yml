- id: T081
  family: channel_yoy
  category: ratio
  question: 上月各渠道保费同比
  match: keyed
  tolerance: 0.03
  gold: "WITH cur AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n  FROM dwd_premium_month p JOIN dwd_policy\
    \ dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month\
    \ < DATE '2026-06-01'\n  GROUP BY 1\n), ly AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n  FROM\
    \ dwd_premium_month p JOIN dwd_policy dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month\
    \ >= DATE '2025-05-01' AND p.stat_month < DATE '2025-05-01' + INTERVAL 1 MONTH\n  GROUP BY 1\n)\nSELECT c.channel_name\
    \ AS 渠道, ROUND(cur.premium, 0) AS 本月保费,\n       ROUND((cur.premium / NULLIF(ly.premium, 0) - 1) * 100, 2) AS 同比百分比\nFROM\
    \ cur JOIN ly USING (channel_code) JOIN dim_channel c USING (channel_code)\nORDER BY 2 DESC"
