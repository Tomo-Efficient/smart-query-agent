- id: P01
  category: pitfall
  match: value
  tolerance: 0.01
  question: 上月保费收入是多少
  gold: 'SELECT ROUND(SUM(COALESCE(p.premium, 0)), 0) AS 保费

    FROM dwd_premium_month p JOIN dwd_policy dp ON p.policy_id = dp.policy_id

    WHERE dp.policy_status = ''有效'' AND p.stat_month >= DATE ''2026-05-01'' AND p.stat_month < DATE ''2026-06-01'''
- id: P02
  category: pitfall
  match: keyed
  tolerance: 0.01
  question: 各渠道保费收入
  gold: 'SELECT c.channel_name AS 渠道, ROUND(SUM(COALESCE(p.premium, 0)), 0) AS 保费

    FROM dwd_premium_month p

    JOIN dwd_policy dp ON p.policy_id = dp.policy_id

    JOIN dim_channel c ON p.channel_code = c.channel_code

    WHERE dp.policy_status = ''有效'' AND p.stat_month >= DATE ''2026-05-01'' AND p.stat_month < DATE ''2026-06-01''

    GROUP BY 1 ORDER BY 2 DESC'
