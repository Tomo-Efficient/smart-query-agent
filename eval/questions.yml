    \  WHERE dp.policy_status='有效' AND p.stat_month>=DATE '2026-05-01' AND p.stat_month<DATE '2026-06-01'),\nprev AS (SELECT\
    \ SUM(COALESCE(p.premium,0)) v FROM dwd_premium_month p JOIN dwd_policy dp ON p.policy_id=dp.policy_id\n  WHERE dp.policy_status='有效'\
    \ AND p.stat_month>=DATE '2026-04-01' AND p.stat_month<DATE '2026-05-01')\nSELECT ROUND((cur.v/NULLIF(prev.v,0)-1)*100,\
    \ 2) AS 环比百分比 FROM cur, prev"
