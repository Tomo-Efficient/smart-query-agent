- id: T011
  family: channel_mom
  category: ratio
  question: 上月各渠道保费环比
  match: keyed
  tolerance: 0.02
  gold: "WITH cur AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n  FROM dwd_premium_month p JOIN dwd_policy\
    \ dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month >= DATE '2026-05-01' AND p.stat_month\
    \ < DATE '2026-06-01'\n  GROUP BY 1\n), prev AS (\n  SELECT p.channel_code, SUM(COALESCE(p.premium, 0)) AS premium\n \
    \ FROM dwd_premium_month p JOIN dwd_policy dp ON p.policy_id = dp.policy_id\n  WHERE dp.policy_status = '有效' AND p.stat_month\
    \ >= DATE '2026-04-01' AND p.stat_month < DATE '2026-05-01'\n  GROUP BY 1\n)\nSELECT c.channel_name AS 渠道, ROUND(cur.premium,\
    \ 0) AS 本月保费,\n       ROUND((cur.premium / NULLIF(prev.premium, 0) - 1) * 100, 2) AS 环比百分比\nFROM cur JOIN prev USING (channel_code)\
    \ JOIN dim_channel c USING (channel_code)\nORDER BY 2 DESC"
