version: 1
# 第四层：业务解释（术语、状态、时间口径、安全规则、同义词）
# 同义词用于查询扩展：命中 key 时把 value 中的词一起送进检索。
synonyms:
  保费: [保费收入, 规模保费, premium, 保费规模]
  签单: [签单保费, 新单保费, 承保保费]
  件均: [件均保费, 单均, 平均保费]
  退保: [退保率, 退保件数, 退保金额, 流失]
  赔付: [赔付率, 理赔, 赔案, 赔款]
  环比: [MoM, 月度增长, 较上月]
  同比: [YoY, 年度增长, 较去年]
  渠道: [个险代理人, 银保渠道, 互联网, 经纪代理]
  险种: [重疾险, 医疗险, 年金险, 定期寿险, 意外险, 产品]
  机构: [分公司, 大区, 区域, 华东, 华南, 华北, 西南]
  有效: [有效保单, 在保, 存量]
  上月: [上一个自然月, 上个月]
  占比: [结构, 份额, 分布, 比重]

cards:
  - id: term.policy_status
    kind: term
    title: 保单状态口径
    tags: [有效, 退保, 满期, 状态, 存量]
    text: |
      policy_status 三个取值：
      - 有效：截至数据截止日仍在保险期间内，且未退保。
      - 退保：发生过退保（以 dwd_surrender 为准），退保后不再确认保费。
      - 满期：保险期间已结束且未退保。
      问"当前/现在有多少保单"指存量，应过滤 policy_status='有效'；
      问"新单/签单"指按 sign_date 统计的保单，不受当前状态影响。

  - id: term.time
    kind: term
    title: 时间口径
    tags: [时间, 上月, 本月, 近30天, 自然月, 环比, 同比, 截止日]
    text: |
      数据截止日：2026-06-30。所有"上个月/本月"都相对这个日期，不随系统时钟变化。
      - 上月 = 2026-05-01 至 2026-05-31（自然月）。
      - 本月 = 2026-06-01 至 2026-06-30，是不完整月份，做环比时要在答案里提示。
      - 近 30 天是滚动窗口，不等于自然月；除非用户明确说近 30 天，默认按自然月。
      - 环比 = 本月/上月 - 1；同比 = 本月/去年同月 - 1。
      - 时间字段选择：保费收入用 stat_month；新单用 sign_date；退保用 surrender_date；理赔用 claim_date。

  - id: term.channel
    kind: term
    title: 渠道业务解释
    tags: [渠道, 个险, 银保, 互联网, 经纪, 代理人, 银行]
    text: |
      四个渠道及业务含义：
      - C01 个险代理人：自建代理人队伍，件均高、长期险为主，是保费基本盘。
      - C02 银保渠道：银行网点代销，年金险占比高，受开门红节奏影响大。
      - C03 互联网：线上直销，医疗险/意外险为主，件均低、件数多。
      - C04 经纪代理：第三方经纪，产品结构均衡。
      "渠道"相关问题默认按 channel_name 分组；不要按 channel_code 硬编码名称。

  - id: term.product
    kind: term
    title: 险种业务解释
    tags: [险种, 重疾, 医疗, 年金, 寿险, 意外, 产品结构]
    text: |
      五个险种：重疾险(P01)、医疗险(P02)、年金险(P03)、定期寿险(P04)、意外险(P05)。
      product_type 把前两者归为"健康险"；做结构分析时可以用险种，也可以用大类。

  - id: term.watermark
    kind: term
    title: 数据新鲜度与完整性
    tags: [数据截止, 新鲜度, 完整性, 分区]
    text: |
      数据截止 2026-06-30，2026-06 为不完整月（可能只有部分日期）。
      2024-01 之前无数据，因此 2025-01 之前无法计算同比。
      宽表 dws_* 与明细表的刷新口径不同，跨表对比前先确认月份完整。

  - id: term.sensitive
    kind: term
    title: 敏感字段与合规
    tags: [敏感, 手机号, 证件号, 脱敏, 隐私, 权限]
    text: |
      dim_customer.phone_masked 与 id_no_masked 属于敏感字段，即使已脱敏也不允许
      在结果集中逐行输出明文/掩码；只允许做聚合（如客户数、按城市分布）。
      任何导出、落库、外发请求一律拒绝。

  - id: term.write_ops
    kind: term
    title: 写操作与越权
    tags: [删除, 更新, 插入, 建表, drop, 写操作, 越权]
    text: |
      本系统只读。禁止 INSERT / UPDATE / DELETE / DROP / CREATE / ALTER / TRUNCATE /
      COPY / ATTACH 等多语句或写操作；禁止访问允许列表之外的表；
      禁止读取本地文件（read_csv / read_parquet / glob）。命中即在 AST 层拒绝。

  - id: term.kpi
    kind: term
    title: 业务关注点
    tags: [KPI, 经营, 考核, 增长, 结构]
    text: |
      管理层最常问的四类问题：保费规模与增长（环比/同比）、渠道与险种结构（占比）、
      质量（退保率/赔付率）、效率（件均保费）。回答时优先给结论和对比，再给明细。
